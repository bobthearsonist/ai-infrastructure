# Top-level config settings
config:
  adminAddr: '0.0.0.0:15000'
  tracing:
    otlpEndpoint: http://host.docker.internal:4317
    randomSampling: true

binds:
  - port: 3847
    listeners:
      - name: mcp-gateway
        routes:
          - name: mcp-tools
            policies:
              # Only agentgateway's own UI (playground) calls this from a browser.
              # '*' let any web page drive every tool behind this listener.
              cors:
                allowOrigins:
                  - 'http://localhost:15001'
                  - 'http://127.0.0.1:15001'
                allowHeaders:
                  - '*'
            backends:
              # Backend 1: SSE-proxied stdio MCPs (stateless - auto-reinitializes sessions)
              - mcp:
                  statefulMode: stateless
                  targets:
                    - name: sequential-thinking
                      sse:
                        host: http://agentgateway-stdio-proxy:7030/servers/sequential-thinking/sse
                    - name: memory
                      sse:
                        # Use the hyphen alias — agentgateway's strict DNS
                        # resolver rejects underscores per RFC 1035.
                        host: http://memory-mcp:7040/servers/memory/sse
                    # Disabled: kapture now runs in its own container and is no longer a
                    # stdio-proxy server, so this path 404s and aborts init for all targets.
                    # - name: kapture
                    #   sse:
                    #     host: http://agentgateway-stdio-proxy:7030/servers/kapture/sse
                    # Qdrant RAG (standalone container - multi-collection)
                    - name: qdrant-notes-work
                      sse:
                        host: http://qdrant-mcp:7020/servers/qdrant-notes-work/sse
                    - name: qdrant-code-work
                      sse:
                        host: http://qdrant-mcp:7020/servers/qdrant-code-work/sse
                    - name: qdrant-code-public
                      sse:
                        host: http://qdrant-mcp:7020/servers/qdrant-code-public/sse
                    - name: qdrant-notes-personal
                      sse:
                        host: http://qdrant-mcp:7020/servers/qdrant-notes-personal/sse
                    - name: context7
                      mcp:
                        host: http://context7-mcp:7008/mcp
                    # Mac (home) only. On windows-work none of the targets below
                    # exist (no playwright :7007, browser-use :7011, hass-mcp,
                    # monarch-money, fantastical or amazon-orders) and any
                    # unreachable target aborts init for every target, so comment
                    # them out there.
                    - name: playwright
                      sse:
                        host: http://host.docker.internal:7007/sse
                    - name: browser-use
                      sse:
                        host: http://host.docker.internal:7011/sse
                    - name: hass-mcp
                      sse:
                        host: http://agentgateway-stdio-proxy:7030/servers/hass-mcp/sse
                    # Monarch Money (personal finance) — standalone container on
                    # ai-shared, NOT via stdio-proxy. Exposes all 8 colvint tools
                    # incl. create_transaction/update_transaction; read-only is
                    # enforced at the Claude Code permission layer (permissions.yaml)
                    # since agentgateway can't filter per-tool. mcpx DOES filter
                    # writes out at its toolGroup (see mcps/mcpx/app.yaml).
                    - name: monarch-money
                      sse:
                        host: http://monarch-money-mcp:7012/servers/monarch-money/sse
                    # Fantastical calendar — HOST bridge, NOT a container. It
                    # drives Fantastical.app via AppleScript/EventKit/TCC, which
                    # only work in the macOS GUI session. A supergateway
                    # LaunchAgent on the host exposes it on :7013; the container
                    # reaches back via host.docker.internal. See mcps/fantastical/.
                    # Writes (create/update) are gated at the client permission
                    # layer — agentgateway can't filter per-tool.
                    - name: fantastical
                      sse:
                        host: http://host.docker.internal:7013/sse
                    # Amazon order history — HOST bridge, NOT a container, and
                    # THIS MACHINE ONLY. It replays a browser session persisted to
                    # ~/.config/amazonorders/cookies.json in this user's home, and
                    # the interactive sign-in needs the macOS GUI session, so the
                    # target is meaningless on any other host. A supergateway
                    # LaunchAgent exposes it on :7014. See mcps/amazon-orders/.
                    #
                    # NOTE the exposure difference from mcpx: agentgateway can't
                    # filter per-tool, so this target carries ALL 13 tools,
                    # including `sign_in` (triggers a browser auth flow) and
                    # `update_config`. mcpx deliberately exposes only 11 read
                    # tools (see mcps/mcpx/app.yaml). Gate the two writes at the
                    # client permission layer, as with monarch-money above.
                    - name: amazon-orders
                      sse:
                        host: http://host.docker.internal:7014/sse
                    # TODO: azure-devops — not yet configured in stdio-proxy/servers.home.json.
                    # Enabling this target without a matching servers.json entry makes
                    # stdio-proxy 404 on /servers/azure-devops/sse, which aborts the
                    # entire multiplex init for ALL targets. Add the uvx/npx invocation
                    # for the azure-devops MCP to servers.home.json first, then uncomment.
                    # - name: azure-devops
                    #   sse:
                    #     host: http://agentgateway-stdio-proxy:7030/servers/azure-devops/sse
                    # TODO: Fix langfuse-prompts - needs langfuse stack running on :3101
                    # - name: langfuse-prompts
                    #   mcp:
                    #     host: http://host.docker.internal:3101/api/public/mcp
                    # TODO: Fix obsidian MCP - needs Obsidian running with semantic plugin on :3001
                    # - name: obsidian
                    #   mcp:
                    #     host: http://host.docker.internal:3001/mcp
