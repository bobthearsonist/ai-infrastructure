name: reverse-proxy

services:
  reverse-proxy:
    image: nginx:alpine
    container_name: ai-reverse-proxy
    restart: unless-stopped
    # Loopback only. The mcpx gateway behind mcpx.localhost is guarded, but its
    # Origin checks can be forged by non-browser callers, and Grafana,
    # Prometheus and Jaeger have no auth of their own. Binding 127.0.0.1 on a
    # port below 1024 needs Docker Desktop's privileged port mapping (vmnetd)
    # enabled: Settings > Advanced > "Allow privileged port mapping".
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
