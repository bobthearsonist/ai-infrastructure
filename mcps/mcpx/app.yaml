toolGroups:
  - name: core
    services:
      sequential-thinking: "*"
      memory: "*"
  - name: coding
    services:
      context7: "*"
  - name: knowledge-notes-work
    services:
      qdrant-notes-work: "*"
  - name: knowledge-code-work
    services:
      qdrant-code-work: "*"
  - name: knowledge-code-public
    services:
      qdrant-code-public: "*"
  - name: devops
    services:
      azure-devops: "*"
  - name: diagrams
    services:
      mermaid: "*"
  - name: homelab
    services:
      hass-mcp:
        - get_version
        - get_entity
        - entity_action
        - list_entities
        - search_entities_tool
        - domain_summary_tool
        - system_overview
        - list_automations
        - restart_ha
        - call_service_tool
        - get_history
        - get_error_log
  - name: browser
    services:
      playwright: "*"
  - name: creative
    services:
      photoshop: "*"
  - name: knowledge-notes-personal
    services:
      qdrant-notes-personal: "*"
  - name: code-quality
    services:
      sonarqube: "*"
  - name: personal-finance
    services:
      monarch-money:
        - check_auth_status
        - get_accounts
        - get_account_holdings
        - get_account_history
        - get_account_snapshots_by_type
        - get_account_type_options
        - get_recent_account_balances
        - get_aggregate_snapshots
        - get_transactions
        - get_transaction_details
        - get_transaction_categories
        - get_transaction_category_groups
        - get_transaction_tags
        - get_transaction_splits
        - get_transactions_summary
        - get_recurring_transactions
        - get_budgets
        - get_cashflow
        - get_cashflow_summary
        - get_credit_history
        - get_institutions
        - get_subscription_details
        - get_transaction_rules
        - find_merchant_id_by_name
        - get_account_transfer_eligibility
        - preview_account_data_transfer
        - get_account_data_transfer_status
      amazon-orders:
        - find_charge
        - get_orders
        - search_orders
        - get_order
        - get_tracking
        - get_invoices
        - get_transactions
        - get_gift_cards
        - get_prime_payments
        - check_session
        - get_config
  - name: calendar
    services:
      fantastical: "*"
  # Explicit read list, never "*": the server also exposes delete/bulk-edit/mail-rule
  # tools. The Paperless token is view-only as well, so this is a second layer.
  - name: paperless-read
    services:
      paperless:
        - list_documents
        - query_documents
        - search_documents
        - get_document
        - get_document_content
        - download_document
        - list_document_notes
        - list_tags
        - list_correspondents
        - get_correspondent
        - list_document_types
        - get_document_type
        - list_custom_fields
        - get_custom_field
        - list_storage_paths
# Requires x-lunar-api-key on MCP (/mcp, /sse) and REST control-plane routes.
# The key comes from AUTH_KEY (secrets/mcpx-auth.env). Consumer tags below are
# client-supplied labels, not identities: the key is the actual boundary.
# The dashboard websocket (/ws-ui) is NOT covered by this; nginx guards it.
auth:
  enabled: true
toolExtensions:
  services: {}
targetServerAttributes:
  context7:
    inactive: false
  sequential-thinking:
    inactive: false
  memory:
    inactive: false
  azure-devops:
    inactive: false
  mermaid:
    inactive: false
  sonarqube:
    inactive: false
