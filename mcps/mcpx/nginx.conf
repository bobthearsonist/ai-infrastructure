events {
    worker_connections 1024;
}

# This proxy is the only way into the mcpx gateway from the host. mcpx's
# dashboard websocket (/ws-ui) has no authentication, and it can rewrite tool
# permissions and add stdio servers, i.e. run commands. mcpx's own API-key
# guard does not cover that websocket, so these checks run here, in front of
# every path, in this order:
#   1. Host allowlist (421): blocks DNS rebinding, where a hostile domain
#      re-resolves to 127.0.0.1 so a web page can call the gateway as
#      same-origin. *.localhost names cannot be rebound, so mcpx.localhost is
#      safe to allow.
#   2. Origin allowlist (403): browsers always send Origin on cross-site
#      requests and websocket upgrades. By default no browser Origin is
#      allowed; see MCPX_DASHBOARD_ORIGIN in the template.
#   3. Key check for Origin-less callers (401): CLIs, scripts and containers
#      must send the real x-lunar-api-key, on every path including /ws-ui.
# Limits: binding to 127.0.0.1 does not keep containers out, because Docker
# Desktop lets any container reach host.docker.internal:9000, and nginx sees
# host and container traffic from the same address. A container that forges
# the dashboard Origin while MCPX_DASHBOARD_ORIGIN is enabled gets the key.
# Containers on ai-shared can also reach mcpx:9000 directly, bypassing this
# proxy entirely; see "Security" in readme.md.

http {
    # The API key is a map key; at the default bucket size (64) nginx refuses
    # to start with "could not build map_hash" once the key is long enough.
    map_hash_bucket_size 128;

    # Rendered from nginx-templates/ at start by the image's envsubst step.
    include /etc/nginx/conf.d/mcpx-api-key.conf;

    upstream mcpx_backend {
        server mcpx:9000;
    }

    upstream mcpx_ui_backend {
        server mcpx:5173;
    }

    map $http_host $mcpx_host_ok {
        default           0;
        "localhost:9000"  1;
        "127.0.0.1:9000"  1;
        "[::1]:9000"      1;
        "localhost:9443"  1;
        "127.0.0.1:9443"  1;
        # platform/reverse-proxy forwards the client's Host unchanged.
        "mcpx.localhost"     1;
        "mcpx.localhost:80"  1;
    }

    # Websocket upgrade for /ws-ui; plain keep-alive for MCP and SSE.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    # MCPX API over HTTP (what MCP clients and the dashboard use)
    server {
        listen 9000;
        server_name _;

        if ($mcpx_host_ok = 0) {
            return 421;
        }
        if ($mcpx_origin_ok = 0) {
            return 403;
        }
        if ($mcpx_unauthenticated) {
            return 401;
        }

        location / {
            proxy_pass http://mcpx_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header x-lunar-api-key $mcpx_api_key;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE and streamable HTTP hold responses open.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # MCPX API over HTTPS
    server {
        listen 9443 ssl;
        server_name _;

        ssl_certificate /etc/ssl/certs/cert.pem;
        ssl_certificate_key /etc/ssl/private/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        if ($mcpx_host_ok = 0) {
            return 421;
        }
        if ($mcpx_origin_ok = 0) {
            return 403;
        }
        if ($mcpx_unauthenticated) {
            return 401;
        }

        location / {
            proxy_pass http://mcpx_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header x-lunar-api-key $mcpx_api_key;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # HTTPS server for MCPX UI (static files only; its API calls go to :9000)
    server {
        listen 5443 ssl;
        server_name localhost;

        ssl_certificate /etc/ssl/certs/cert.pem;
        ssl_certificate_key /etc/ssl/private/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://mcpx_ui_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTP server for Chrome DevTools Protocol proxy
    server {
        listen 9222;
        server_name localhost;

        location / {
            # Use the host-gateway IP directly (set in docker-compose extra_hosts)
            set $chrome_host host.docker.internal;
            proxy_pass http://$chrome_host:9222;
            proxy_http_version 1.1;

            # WebSocket support (required for Chrome DevTools Protocol)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Prevent timeouts during debugging sessions
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 3600s;
        }
    }

    # WebSocket server for Kapture MCP
    server {
        listen 61822;
        server_name localhost;

        location / {
            # Proxy to Kapture server running in mcpx container
            proxy_pass http://mcpx:61822;
            proxy_http_version 1.1;

            # WebSocket support (required for Kapture)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Prevent timeouts during automation sessions
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 3600s;
        }
    }
}
