name: mcpx

include:
  - path: ../../mcps/stdio-proxy/docker-compose.yml
  # Per-server overlays — each adds the mounts/env its MCP needs to the
  # shared stdio-proxy. Compose merges service definitions across includes
  # so these are additive, not replacements.
  - path: ../../mcps/azure-devops/docker-compose.yml

services:
  # Extend the included stdio-proxy to also reach ai-shared services
  # (e.g. kapture-server). The private `default` network stays primary so
  # `stdio-proxy` hostname resolves locally for mcpx, avoiding the
  # cross-stack DNS collision that commit 6e7fc82 fixed. The /local-pypi
  # mount mirrors the standalone stdio-proxy override so psmcp (photoshop)
  # can find its package index — `include:` doesn't pull override.yml in.
  stdio-proxy:
    networks:
      default:
        # Stable alias on mcpx's private network. mcp.json uses this name —
        # NOT the bare `stdio-proxy` service-name alias, because Compose
        # auto-publishes that alias on EVERY attached network including
        # ai-shared, where it collides with agentgateway's stdio-proxy.
        # (Empirically: setting `aliases: []` on ai-shared does NOT suppress
        # the auto-alias — Compose treats `aliases:` as additive.)
        aliases:
          - mcpx-stdio-proxy
      ai-shared:
    volumes:
      - ~/.local-pypi:/local-pypi:ro

  # MCPX Gateway - MCP Proxy Server
  # https://docs.lunar.dev/mcpx/architecture
  # Changelog: https://github.com/TheLunarCompany/lunar/blob/main/mcpx/CHANGELOG.md
  mcpx:
    image: us-central1-docker.pkg.dev/prj-common-442813/mcpx/mcpx:latest
    container_name: mcpx
    restart: unless-stopped
    # Gateway process idles ~220MB; 512m caps blast radius without
    # OOM-killing it under request load.
    mem_limit: 512m
    # Not privileged. The image only needs it for Docker-in-Docker, which
    # serves stdio MCPs launched with `command: docker`; none in mcp.json are.
    # Without it the entrypoint logs "privileged=no, skipping docker". Adding a
    # docker-launched stdio server means revisiting this, not flipping it back.
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    # :9000 is deliberately NOT published here. Host clients reach the API
    # through nginx-ssl, which enforces Host/Origin checks that mcpx lacks (see
    # nginx.conf). Everything else is loopback only.
    ports:
      # Dashboard on an uncommon host port, IPv4 only. 5173 is Vite's default
      # dev port, so on the host it is routinely served by other projects
      # (often on [::1], which Docker never holds), and every page served there
      # would carry the Origin the gateway trusts.
      - "127.0.0.1:15173:5173" # Control Plane UI (static files; API calls go to :9000)
      - "127.0.0.1:9001:9001" # Internal webserver port
      - "127.0.0.1:3100:3000" # Metrics port (remapped from 3000 - conflict with other service)
    # AUTH_KEY: the API key mcpx requires on MCP and REST routes when
    # app.yaml sets auth.enabled. Clients send it as x-lunar-api-key.
    env_file:
      - ./secrets/mcpx-auth.env
    environment:
      - NODE_EXTRA_CA_CERTS=${CUSTOM_CA_CERT:+/usr/local/share/ca-certificates/custom-ca.pem}
      # REST CORS and the /ws-ui socket.io origin. Unset, the websocket allows
      # "*". This only restrains browsers' long-polling; websocket upgrades
      # skip CORS, which is why nginx-ssl does the real Origin check.
      - CORS_ORIGINS=http://127.0.0.1:15173
      # host.docker.internal resolves to an IPv4 and an unroutable IPv6 address.
      # Node's happy-eyeballs gives the IPv4 attempt only 250ms (measured on
      # the event loop), so a busy loop or a brief Docker VM stall abandons a
      # working connect, fails over to IPv6 (ENETUNREACH) and every
      # host-routed upstream drops at once. Reconnects reset Playwright tabs.
      # Disabling it uses the first address with the normal connect timeout;
      # ipv4first makes that address the IPv4 one regardless of resolver order.
      - NODE_OPTIONS=--no-network-family-autoselection --dns-result-order=ipv4first
    volumes:
      - ./:/lunar/packages/mcpx-server/config
      - ${MCP_CONFIG}:/lunar/packages/mcpx-server/config/mcp.json:ro
      - ${CUSTOM_CA_CERT:-/dev/null}:/usr/local/share/ca-certificates/custom-ca.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # service_started, NOT service_healthy. stdio-proxy fronts npx-based MCPs
    # that can break independently of this gateway, and mcp-proxy initialises
    # every named server eagerly and fatally — one bad child exits the whole
    # process. Gating on health let that single failure hold down the entire
    # gateway, including the HTTP-served MCPs with no stdio dependency at all.
    # Start alongside it and degrade instead of failing closed.
    depends_on:
      stdio-proxy:
        condition: service_started
    # Probe mcpx-server's own Prometheus metrics endpoint, NOT the UI.
    # The UI is a separate supervisord program — if mcpx-server FATALs
    # (e.g. bad app.yaml) the UI stays up and the container looks "healthy"
    # while the gateway on :9000 is dead. The metrics endpoint is started
    # by mcpx-server itself, so a 2xx here proves the gateway is alive.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - default        # Private network for stdio-proxy
      - ai-shared      # Shared network for other MCP services

  # NGINX SSL Proxy
  nginx-ssl:
    image: nginx:alpine
    container_name: mcpx-ssl-proxy
    restart: unless-stopped
    mem_limit: 128m
    # Loopback only. This is the guarded front door to mcpx (see nginx.conf);
    # Origin checks can be forged by non-browser clients, so it must not be
    # reachable from the LAN or tailnet. :9222 fronts the host browser's
    # DevTools protocol.
    ports:
      - "127.0.0.1:9000:9000" # MCPX API port (SSE + streamable HTTP), guarded
      - "127.0.0.1:9443:9443" # HTTPS MCPX API port, guarded
      - "127.0.0.1:5443:5443" # HTTPS Control Plane UI port
      - "127.0.0.1:9222:9222" # Chrome DevTools Protocol proxy port
      # Kapture WebSocket (61822) is now served by the kapture-server container
      # in mcps/kapture/docker-compose.yml — do NOT publish it here.
    # AUTH_KEY is rendered into nginx-templates/ at start. It is therefore
    # visible in `docker inspect` (Config.Env), as it is for mcpx; keeping it
    # out would need a custom entrypoint script, which this stock image avoids.
    env_file:
      - ./secrets/mcpx-auth.env
    environment:
      # Browser Origin allowed to use the gateway (and given the injected key).
      # Enable only while using the dashboard:
      #   MCPX_DASHBOARD_ORIGIN=http://127.0.0.1:15173 docker compose up -d nginx-ssl
      # and run plain `docker compose up -d nginx-ssl` afterwards to turn it off.
      # The default is a never-matching regex, NOT a word like "off": any value
      # here is something a non-browser caller can send as its Origin header.
      # Do not put this variable in .env, or the dashboard stays on silently.
      - MCPX_DASHBOARD_ORIGIN=${MCPX_DASHBOARD_ORIGIN:-~^(?!)}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-templates:/etc/nginx/templates:ro
      - ./certs/tls/cert.pem:/etc/ssl/certs/cert.pem:ro
      - ./certs/tls/key.pem:/etc/ssl/private/key.pem:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro # Disable default config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mcpx:
        condition: service_healthy
    networks:
      - default        # Can reach mcpx on private network

networks:
  default:
    # Private network for stdio-proxy (included service)
    # Each stack gets its own default network to prevent DNS collisions
  ai-shared:
    external: true
