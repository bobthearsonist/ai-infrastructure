name: playwright

version: '3.9'

services:
  mcp_playwright:
    image: mcr.microsoft.com/playwright/mcp:latest
    container_name: mcp_playwright
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # The image already sets the entrypoint to the CLI.
    # --allowed-hosts is playwright-mcp's DNS-rebinding guard: it rejects any
    # Host header not listed. Gateways (mcpx, agentgateway) reach this through
    # host.docker.internal:7007, local tools through localhost. Both the bare
    # and :port forms are listed because the server checks the header both ways.
    command:
      - '--host=0.0.0.0'
      - '--port=7007'
      - '--allowed-hosts'
      - 'host.docker.internal,host.docker.internal:7007,localhost,localhost:7007,127.0.0.1,127.0.0.1:7007'
    # Loopback only: this drives a real browser for whoever can reach it.
    ports:
      - '127.0.0.1:7007:7007' # localhost:7007/mcp
    restart: unless-stopped
    environment:
      PLAYWRIGHT_DISABLE_GPU: '1' # optional; fine to remove
    volumes:
      - ./data/playwright-cache:/root/.cache/ms-playwright
      # remove or adjust this if you don't need a custom profile dir:
      - ./data/playwright-profile:/home/pw/profile
    # Healthcheck: TCP port check using node (curl/wget not available in official image).
    # The official Playwright MCP image intentionally has no /health endpoint to stay minimal.
    # See rejected PR: https://github.com/microsoft/playwright-mcp/pull/1054
    healthcheck:
      test: ['CMD-SHELL', 'node -e "const net = require(\"net\"); const s = net.connect(7007, () => { s.end(); process.exit(0); }); s.on(\"error\", () => process.exit(1));"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Deliberately NOT on ai-shared. This container renders untrusted web
    # pages; on ai-shared a hostile page could reach mcpx:9000/ws-ui (which
    # mcpx does not authenticate) and every other MCP server directly. It stays
    # on its own project network and is reached only via its loopback port.
