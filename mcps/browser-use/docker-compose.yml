name: browser-use

services:
  browser_use_proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: browser-use-proxy
    command:
      [
        '--port',
        '7011',
        '--host',
        '0.0.0.0',
        '--pass-environment',
        '--',
        'docker-run-with-secrets',
        '-i',
        '--rm',
        '--network=browser-use_default',
        '--name=browser-use-mcp',
        '--label=com.docker.compose.project=browser-use',
        '--label=com.docker.compose.service=browser-use-mcp',
        '-e',
        'BROWSER_USE_HEADLESS',
        '-e',
        'BROWSER_USE_LOGGING_LEVEL',
        '-e',
        'BROWSER_USE_SETUP_LOGGING',
        '-e',
        'MCP_PORT',
        'browser-use:latest',
        'browser-use',
        '--mcp',
      ]
    # Loopback only: this drives a real browser for whoever can reach it.
    # Gateways reach it via host.docker.internal:7011.
    ports:
      - '127.0.0.1:7011:7011'
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # One file per API key, named after its env var (OPENAI_API_KEY, ...).
      # docker-run-with-secrets mounts it into each browser-use-mcp container,
      # whose entrypoint exports the files, so no key is in either container's
      # config. No env_file: .env would put every key back into this one.
      - ./secrets:/run/secrets/browser-use:ro
    environment:
      - PYTHONUNBUFFERED=1
      # Forwarded to browser-use-mcp by --pass-environment and -e above.
      - BROWSER_USE_HEADLESS=${BROWSER_USE_HEADLESS:-true}
      - BROWSER_USE_LOGGING_LEVEL=${BROWSER_USE_LOGGING_LEVEL:-WARNING}
      - BROWSER_USE_SETUP_LOGGING=${BROWSER_USE_SETUP_LOGGING:-false}
      - MCP_PORT=${MCP_PORT:-7009}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:7011/status || exit 1']
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    # Deliberately NOT on ai-shared, and neither are the browser-use-mcp
    # containers it starts (--network=browser-use_default above, this project's
    # own network). They render untrusted web pages; on ai-shared a hostile
    # page could reach mcpx:9000/ws-ui (unauthenticated) and every MCP server.
