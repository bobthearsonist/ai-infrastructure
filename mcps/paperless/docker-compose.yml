services:
  paperless-mcp:
    build: .
    image: paperless-mcp:2.3.0
    container_name: paperless-mcp
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    labels:
      # Locally built image; there is nothing for watchtower to pull.
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      PAPERLESS_URL: https://paperless.purplepensieve.synology.me
    secrets:
      - paperless_api_key
    networks:
      - ai-shared
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7015/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

secrets:
  paperless_api_key:
    file: ./secrets/paperless_api_key

networks:
  ai-shared:
    external: true
