; Override of the image's supervisord program. Changes from upstream:
;  - profile moved off Chrome's default dir (/home/neko/.config/google-chrome):
;    Chrome >=136 refuses --remote-debugging-port on the default profile.
;  - --remote-debugging-port=9222 on loopback only. Nothing publishes 9222;
;    only the playwright sidecar (same network namespace) can reach it.
;  - dropped --bwsi so Google/Amazon web sign-in behaves normally.
[program:google-chrome]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/google-chrome
  --no-sandbox
  --window-position=0,0
  --display=%(ENV_DISPLAY)s
  --user-data-dir=/home/neko/profile
  --remote-debugging-port=9222
  --no-first-run
  --no-default-browser-check
  --start-maximized
  --disable-gpu
  --disable-software-rasterizer
  --disable-dev-shm-usage
stopsignal=INT
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/google-chrome.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true

[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
