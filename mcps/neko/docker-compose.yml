name: neko

# Logged-in "personal" browser: Chromium you sign into by hand through a web
# viewer, then drive from agents via Playwright MCP over CDP.
# Why: Google refuses sign-in in Playwright-launched Chromium; a normally launched
# browser signed in by a human, attached to later over CDP, is not flagged.
#
# Viewer: linuxserver/chromium (Selkies). The screen streams over a websocket on
# the HTTP port, so nothing depends on WebRTC media ports. The neko image
# (config/google-chrome.conf) never got WebRTC through Docker Desktop's macOS
# port forwarder; it remains an option on hosts with real host networking.
#
# Security model (see mcpx readme "Security"):
#  - Deliberately NOT on ai-shared. This browser holds live sessions and renders
#    untrusted pages.
#  - Everything published on 127.0.0.1 only. CDP (9222) is never published: the
#    playwright sidecar shares the browser's network namespace and reaches it on
#    loopback.
#  - Anything that can reach 127.0.0.1:7016 can act as you on every signed-in site.

services:
  chromium-personal:
    image: lscr.io/linuxserver/chromium:latest
    container_name: chromium_personal
    restart: unless-stopped
    shm_size: 2gb
    security_opt:
      # Chromium's own sandbox (enabled via config/wrapped-chromium) needs
      # namespace syscalls Docker's default seccomp profile blocks. Tested on
      # Docker Desktop: default seccomp + sandbox fails with "No usable sandbox".
      - seccomp:unconfined
    env_file: ./secrets/chromium.env   # CUSTOM_USER / PASSWORD: viewer basic auth
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: America/New_York
      # No terminal, sudo, file transfer or app launcher in the viewer desktop.
      HARDEN_DESKTOP: 'true'
      # Cross-site WebSocket-hijacking guard. The image ships '*', which lets any
      # page open in the host browser reuse its cached basic-auth credentials to
      # drive this browser. Listed explicitly because nginx forwards Host without
      # the port, so Selkies' same-origin fallback would not match.
      SELKIES_ALLOWED_ORIGINS: 'http://localhost:8091,http://127.0.0.1:8091'
      # Appended after the wrapper's own flags, so this --user-data-dir wins.
      # Profile is off Chromium's default dir: Chromium >=136 ignores
      # --remote-debugging-port on the default profile. CDP binds loopback only.
      CHROME_CLI: >-
        --user-data-dir=/config/profile
        --remote-debugging-port=9222
        --no-first-run
        --no-default-browser-check
    volumes:
      - ./data/chromium-config:/config
      - ./config/policies.json:/etc/chromium/policies/managed/policies.json:ro
      - ./config/wrapped-chromium:/usr/bin/wrapped-chromium:ro
    ports:
      - '127.0.0.1:8091:3000'   # viewer  http://localhost:8091
      - '127.0.0.1:7016:7016'   # playwright-personal MCP (sidecar below)

  mcp-playwright-personal:
    image: mcr.microsoft.com/playwright/mcp:latest
    container_name: mcp_playwright_personal
    restart: unless-stopped
    network_mode: 'service:chromium-personal'
    depends_on: [chromium-personal]
    command:
      - '--cdp-endpoint=http://127.0.0.1:9222'
      - '--host=0.0.0.0'
      - '--port=7016'
      - '--allowed-hosts'
      - 'host.docker.internal,host.docker.internal:7016,localhost,localhost:7016,127.0.0.1,127.0.0.1:7016'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "const net = require(\"net\"); const s = net.connect(7016, () => { s.end(); process.exit(0); }); s.on(\"error\", () => process.exit(1));"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
